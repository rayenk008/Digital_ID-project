<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Ministry of Interior</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <ol>
            <li>Tunisia the Ministry of the Interior </li>
            <div id="h"><a href="#"><li id="l1">contact</li></a>
            <a href="#" id="l2"><li>help</li></a></div>
        </ol>
    </nav>
    <main>
        <form class="login-form" action="register.php" method="post" onsubmit="return validateForm()">
            <h1>Register for Electronic ID</h1>
            <div class="form-group">
                <label for="national_id" class="form-label">National ID Number</label>
                <input type="text" id="national_id" name="national_id" class="form-input" placeholder="12345678" required maxlength="8">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password (8 uppercase letters)</label>
                <input type="password" id="password" name="password" class="form-input" minlength="8" maxlength="8" required>
            </div>
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" name="name" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="address" class="form-label">Address</label>
                <input type="text" id="address" name="address" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="form-input" required>
            </div>
            <button type="submit" class="btn1">Register</button>
        </form>
    </main>
    <script src="code.js"></script>
    <script>
        function validateForm() {
            const id = document.getElementById('national_id').value;
            const pass = document.getElementById('password').value;
            if (id.length !== 8 || !/^[A-Z]{8}$/.test(pass)) {
                alert("ID must be 8 digits, password 8 uppercase letters.");
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
